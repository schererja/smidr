# Smidr Agent Configuration
# Generated by 'smidr init my-smidr-project'

agent:
  # Unique agent identifier. Leave empty to auto-generate and persist to id_file.
  id: "my-smidr-project"

  # File path where the agent ID is persisted when generated.
  id_file: "~/.config/smidr/agent-id"

  # Demo mode uses in-memory execution; do not use in production.
  demo: false

control_plane:
  # Control plane base URI (e.g., https://api.smidr.dev)
  uri: "https://api.smidr.dev"

runtime:
  # Working directory for builds and artifacts.
  work_dir: "~/.local/share/smidr"
