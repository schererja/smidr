# Smidr Control Plane / Server Configuration

agent_server:
  host: 0.0.0.0
  port: 8080  # Agent API endpoint

web_server:
  host: 0.0.0.0
  port: 9000  # Web/UI API endpoint

store:
  type: memory  # Use "memory" for in-memory store (dev/test) or "sqlite" with CGO support
  sqlite_path: /var/lib/smidr/data/smidr.db  # Only used if type is sqlite

log_level: info
