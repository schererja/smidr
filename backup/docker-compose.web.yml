version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.core
    ports:
      - "8080:8080"
      - "9001:9001"
    environment:
      - LOG_LEVEL=info
    volumes:
      - ./smidr.db:/app/smidr.db
    command: ./bin/smidr-core -config config.yaml

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8080
    depends_on:
      - backend
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3000",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
