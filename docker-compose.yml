services:
  postgres:
    image: postgres:16-alpine
    container_name: smidr-postgres
    environment:
      POSTGRES_DB: smidr
      POSTGRES_USER: smidr
      POSTGRES_PASSWORD: smidr
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smidr"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - smidr-network

  control-plane:
    build:
      context: ./control-plane
      dockerfile: Dockerfile
    container_name: smidr-control-plane
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: https://+:5001
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/aspnetapp.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: ${CERT_PASSWORD:-development}
      UsePostgres: "true"
      ConnectionStrings__PostgreSQL: "Host=postgres;Database=smidr;Username=smidr;Password=smidr"
    ports:
      - "5001:5001"
    volumes:
      - control-plane-data:/app/data
      - ./certs:/https:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - smidr-network
    healthcheck:
      test: ["CMD-SHELL", "curl -k -f https://localhost:5001/swagger || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: smidr-ui
    environment:
      VITE_API_BASE_URL: https://control-plane:5001
    ports:
      - "3000:3000"
    depends_on:
      control-plane:
        condition: service_healthy
    networks:
      - smidr-network

networks:
  smidr-network:
    driver: bridge

volumes:
  postgres-data:
  control-plane-data:
