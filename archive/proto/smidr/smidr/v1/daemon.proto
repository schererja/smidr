syntax = "proto3";

package smidr.v1;

option csharp_namespace = "Smidr.Proto.V1";

import "google/protobuf/timestamp.proto";

import "common.proto";

// Daemon registration and capabilities.
message RegisterDaemonRequest {
  string daemon_id = 1;                     // optional on first register
  string hostname = 2;
  repeated string supported_providers = 3;  // e.g., ["docker", "podman"]
  ResourceCapabilities capabilities = 4;
  string version = 5;
  map<string, string> labels = 6;           // zone, env, custom tags
}

// Response to daemon registration.
message RegisterDaemonResponse {
  bool accepted = 1;
  string assigned_id = 2;                   // set if daemon_id not provided
  string message = 3;                       // optional notes/errors
}

// Periodic daemon heartbeat.
message HeartbeatRequest {
  string daemon_id = 1;
  google.protobuf.Timestamp at = 2;
  double cpu_utilization = 3;               // 0..1
  double memory_utilization = 4;            // 0..1
  map<string, string> health = 5;           // e.g., provider=ok/warn/down
}

message HeartbeatResponse {}

// Metrics batch (simple, flexible).
message ReportMetricsRequest {
  string daemon_id = 1;
  google.protobuf.Timestamp at = 2;
  map<string, double> gauges = 3;           // e.g., "load.1m" -> 0.42
  map<string, int64> counters = 4;          // e.g., "tasks.completed" -> 12
}

message ReportMetricsResponse {}

// Subscribe for tasks of certain types/capabilities.
message ReceiveTasksRequest {
  string daemon_id = 1;
  repeated TaskType accepted_types = 2;
  map<string, string> selector = 3;         // label/attribute selector
}
