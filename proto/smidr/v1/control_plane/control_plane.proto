syntax = "proto3";
package smidr.control_plane;

import "google/protobuf/timestamp.proto";
import "smidr/v1/common/policy.proto";
import "smidr/v1/common/types.proto";

option go_package = "github.com/schererja/smidr/agents/go/pkg/smidr/v1/control_plane";

// ========================================
// Control Plane Orchestration Service
// This service handles the coordination between
// jobs, agents, and policies
// ========================================

service ControlPlaneService {
  // Health check for control plane
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);

  // Get system metrics and statistics
  rpc GetSystemMetrics(GetSystemMetricsRequest) returns (GetSystemMetricsResponse);

  // Get agent registry status
  rpc GetAgentRegistry(GetAgentRegistryRequest) returns (GetAgentRegistryResponse);

  // Evaluate policy for a job request
  rpc EvaluatePolicy(EvaluatePolicyRequest) returns (EvaluatePolicyResponse);
}

// ========================================
// Health Check
// ========================================

message HealthCheckRequest {}

message HealthCheckResponse {
  HealthStatus status = 1;
  string version = 2;
  google.protobuf.Timestamp timestamp = 3;
  map<string, string> components = 4; // Component status
}

enum HealthStatus {
  HEALTH_STATUS_UNKNOWN = 0;
  HEALTH_STATUS_HEALTHY = 1;
  HEALTH_STATUS_DEGRADED = 2;
  HEALTH_STATUS_UNHEALTHY = 3;
}

// ========================================
// System Metrics
// ========================================

message GetSystemMetricsRequest {
  smidr.common.TenantID tenant_id = 1; // Optional: filter by tenant
}

message GetSystemMetricsResponse {
  SystemMetrics metrics = 1;
}

message SystemMetrics {
  // Jobs
  int32 total_jobs = 1;
  int32 queued_jobs = 2;
  int32 running_jobs = 3;
  int32 completed_jobs_24h = 4;
  int32 failed_jobs_24h = 5;

  // Agents
  int32 total_agents = 6;
  int32 idle_agents = 7;
  int32 busy_agents = 8;
  int32 offline_agents = 9;

  // Artifacts
  int32 total_artifacts = 10;
  int64 total_artifact_size_bytes = 11;

  // Tenants
  int32 total_tenants = 12;
  int32 active_tenants = 13;

  google.protobuf.Timestamp snapshot_time = 14;
}

// ========================================
// Agent Registry
// ========================================

message GetAgentRegistryRequest {
  smidr.common.TenantID tenant_id = 1;
  smidr.common.ProjectID project_id = 2; // Optional filter
  repeated smidr.common.AgentState states = 3; // Optional filter
}

message GetAgentRegistryResponse {
  repeated AgentInfo agents = 1;
}

message AgentInfo {
  smidr.common.AgentID agent_id = 1;
  smidr.common.TenantID tenant_id = 2;
  smidr.common.ProjectID project_id = 3;
  string name = 4;
  smidr.common.AgentState state = 5;
  smidr.common.AgentCapabilities capabilities = 6;
  int32 current_job_count = 7;
  int32 max_concurrent_jobs = 8;
  google.protobuf.Timestamp last_heartbeat = 9;
  google.protobuf.Timestamp registered_at = 10;
}

// ========================================
// Policy Evaluation
// ========================================

message EvaluatePolicyRequest {
  smidr.common.TenantID tenant_id = 1;
  smidr.common.ProjectID project_id = 2;
  string job_type = 3;
  smidr.common.ResourceLimits requested_resources = 4;
  repeated string required_capabilities = 5;
}

message EvaluatePolicyResponse {
  smidr.common.PolicyDecision decision = 1;
  smidr.common.PolicySet applied_policy = 2;
}
