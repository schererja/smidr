syntax = "proto3";

package smidr.control_plane;

import "google/protobuf/timestamp.proto";
import "smidr/v1/common/policy.proto";
import "smidr/v1/common/types.proto";

option go_package = "github.com/schererja/smidr/agents/go/pkg/smidr/v1/control_plane";

// ========================================
// Tenant Service
// ========================================

service TenantService {
  // Create a new tenant
  rpc CreateTenant(CreateTenantRequest) returns (CreateTenantResponse);

  // Get tenant details
  rpc GetTenant(GetTenantRequest) returns (GetTenantResponse);

  // Update tenant
  rpc UpdateTenant(UpdateTenantRequest) returns (UpdateTenantResponse);

  // List all tenants (admin only)
  rpc ListTenants(ListTenantsRequest) returns (ListTenantsResponse);

  // Set tenant policies
  rpc SetTenantPolicy(SetTenantPolicyRequest) returns (SetTenantPolicyResponse);

  // Get tenant policies
  rpc GetTenantPolicy(GetTenantPolicyRequest) returns (GetTenantPolicyResponse);
}

// ========================================
// Project Service
// ========================================

service ProjectService {
  // Create a new project within a tenant
  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse);

  // Get project details
  rpc GetProject(GetProjectRequest) returns (GetProjectResponse);

  // Update project
  rpc UpdateProject(UpdateProjectRequest) returns (UpdateProjectResponse);

  // List projects in a tenant
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);

  // Delete project
  rpc DeleteProject(DeleteProjectRequest) returns (DeleteProjectResponse);

  // Set project policies
  rpc SetProjectPolicy(SetProjectPolicyRequest) returns (SetProjectPolicyResponse);
}

// ========================================
// User Service
// ========================================

service UserService {
  // Create a new user
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);

  // Get user details
  rpc GetUser(GetUserRequest) returns (GetUserResponse);

  // Update user
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);

  // List users in a tenant
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);

  // Assign user to project
  rpc AssignUserToProject(AssignUserToProjectRequest) returns (AssignUserToProjectResponse);

  // Set user roles
  rpc SetUserRoles(SetUserRolesRequest) returns (SetUserRolesResponse);
}

// ========================================
// Tenant Definition
// ========================================

message Tenant {
  smidr.common.TenantID tenant_id = 1;
  string name = 2;
  string description = 3;
  TenantStatus status = 4;

  // Resource limits
  int32 max_agents = 5;
  int32 max_concurrent_jobs = 6;
  int64 storage_quota_bytes = 7;

  // Billing
  string billing_email = 8;
  string subscription_tier = 9;

  // Policies
  smidr.common.PolicySet default_policy = 10;

  // Metadata
  smidr.common.Metadata metadata = 11;
  smidr.common.AuditMetadata audit = 12;
}

enum TenantStatus {
  TENANT_STATUS_UNSPECIFIED = 0;
  TENANT_STATUS_ACTIVE = 1;
  TENANT_STATUS_SUSPENDED = 2;
  TENANT_STATUS_TRIAL = 3;
  TENANT_STATUS_DELETED = 4;
}

// ========================================
// Project Definition
// ========================================

message Project {
  smidr.common.ProjectID project_id = 1;
  smidr.common.TenantID tenant_id = 2;
  string name = 3;
  string description = 4;
  ProjectStatus status = 5;

  // Resource limits (inherits from tenant if not set)
  int32 max_agents = 6;
  int32 max_concurrent_jobs = 7;
  int64 storage_quota_bytes = 8;

  // Policies (merged with tenant policies)
  smidr.common.PolicySet policy = 9;

  // Metadata
  smidr.common.Metadata metadata = 10;
  smidr.common.AuditMetadata audit = 11;
}

enum ProjectStatus {
  PROJECT_STATUS_UNSPECIFIED = 0;
  PROJECT_STATUS_ACTIVE = 1;
  PROJECT_STATUS_ARCHIVED = 2;
  PROJECT_STATUS_DELETED = 3;
}

// ========================================
// User Definition
// ========================================

message User {
  smidr.common.UserID user_id = 1;
  smidr.common.TenantID tenant_id = 2;
  string username = 3;
  string email = 4;
  string full_name = 5;
  UserStatus status = 6;

  // Roles
  repeated UserRole roles = 7;

  // Project associations
  repeated smidr.common.ProjectID project_ids = 8;

  // Security
  bool mfa_enabled = 9;
  google.protobuf.Timestamp last_login = 10;

  // Metadata
  smidr.common.Metadata metadata = 11;
  smidr.common.AuditMetadata audit = 12;
}

enum UserStatus {
  USER_STATUS_UNSPECIFIED = 0;
  USER_STATUS_ACTIVE = 1;
  USER_STATUS_SUSPENDED = 2;
  USER_STATUS_DELETED = 3;
}

enum UserRole {
  USER_ROLE_UNSPECIFIED = 0;
  USER_ROLE_ADMIN = 1; // Full tenant access
  USER_ROLE_OPERATOR = 2; // Manage jobs and agents
  USER_ROLE_ENGINEER = 3; // Submit jobs, view results
  USER_ROLE_VIEWER = 4; // Read-only access
  USER_ROLE_PROJECT_ADMIN = 5; // Admin for specific projects
}

// ========================================
// Request/Response Messages - Tenant
// ========================================

message CreateTenantRequest {
  string name = 1;
  string description = 2;
  string billing_email = 3;
  string subscription_tier = 4;
  smidr.common.Metadata metadata = 5;
}

message CreateTenantResponse {
  smidr.common.TenantID tenant_id = 1;
}

message GetTenantRequest {
  smidr.common.TenantID tenant_id = 1;
}

message GetTenantResponse {
  Tenant tenant = 1;
}

message UpdateTenantRequest {
  smidr.common.TenantID tenant_id = 1;
  string name = 2;
  string description = 3;
  TenantStatus status = 4;
  int32 max_agents = 5;
  int32 max_concurrent_jobs = 6;
  int64 storage_quota_bytes = 7;
}

message UpdateTenantResponse {
  bool success = 1;
}

message ListTenantsRequest {
  int32 page_size = 1;
  string page_token = 2;
  repeated TenantStatus statuses = 3; // Filter
}

message ListTenantsResponse {
  repeated Tenant tenants = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message SetTenantPolicyRequest {
  smidr.common.TenantID tenant_id = 1;
  smidr.common.PolicySet policy = 2;
}

message SetTenantPolicyResponse {
  bool success = 1;
}

message GetTenantPolicyRequest {
  smidr.common.TenantID tenant_id = 1;
}

message GetTenantPolicyResponse {
  smidr.common.PolicySet policy = 1;
}

// ========================================
// Request/Response Messages - Project
// ========================================

message CreateProjectRequest {
  smidr.common.TenantID tenant_id = 1;
  string name = 2;
  string description = 3;
  smidr.common.Metadata metadata = 4;
}

message CreateProjectResponse {
  smidr.common.ProjectID project_id = 1;
}

message GetProjectRequest {
  smidr.common.ProjectID project_id = 1;
}

message GetProjectResponse {
  Project project = 1;
}

message UpdateProjectRequest {
  smidr.common.ProjectID project_id = 1;
  string name = 2;
  string description = 3;
  ProjectStatus status = 4;
  int32 max_agents = 5;
  int32 max_concurrent_jobs = 6;
}

message UpdateProjectResponse {
  bool success = 1;
}

message ListProjectsRequest {
  smidr.common.TenantID tenant_id = 1;
  int32 page_size = 2;
  string page_token = 3;
  repeated ProjectStatus statuses = 4; // Filter
}

message ListProjectsResponse {
  repeated Project projects = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message DeleteProjectRequest {
  smidr.common.ProjectID project_id = 1;
  bool force = 2; // Delete even if has resources
}

message DeleteProjectResponse {
  bool success = 1;
}

message SetProjectPolicyRequest {
  smidr.common.ProjectID project_id = 1;
  smidr.common.PolicySet policy = 2;
}

message SetProjectPolicyResponse {
  bool success = 1;
}

// ========================================
// Request/Response Messages - User
// ========================================

message CreateUserRequest {
  smidr.common.TenantID tenant_id = 1;
  string username = 2;
  string email = 3;
  string full_name = 4;
  repeated UserRole roles = 5;
  repeated smidr.common.ProjectID project_ids = 6;
}

message CreateUserResponse {
  smidr.common.UserID user_id = 1;
}

message GetUserRequest {
  smidr.common.UserID user_id = 1;
}

message GetUserResponse {
  User user = 1;
}

message UpdateUserRequest {
  smidr.common.UserID user_id = 1;
  string email = 2;
  string full_name = 3;
  UserStatus status = 4;
  bool mfa_enabled = 5;
}

message UpdateUserResponse {
  bool success = 1;
}

message ListUsersRequest {
  smidr.common.TenantID tenant_id = 1;
  smidr.common.ProjectID project_id = 2; // Optional filter
  int32 page_size = 3;
  string page_token = 4;
}

message ListUsersResponse {
  repeated User users = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message AssignUserToProjectRequest {
  smidr.common.UserID user_id = 1;
  smidr.common.ProjectID project_id = 2;
}

message AssignUserToProjectResponse {
  bool success = 1;
}

message SetUserRolesRequest {
  smidr.common.UserID user_id = 1;
  repeated UserRole roles = 2;
}

message SetUserRolesResponse {
  bool success = 1;
}
