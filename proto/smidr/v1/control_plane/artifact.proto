syntax = "proto3";
package smidr.control_plane;

import "google/protobuf/timestamp.proto";
import "smidr/v1/common/policy.proto";
import "smidr/v1/common/types.proto";

option go_package = "github.com/schererja/smidr/agents/go/pkg/smidr/v1/control_plane";

// ========================================
// Artifact Service
// ========================================

service ArtifactService {
  // Register a new artifact
  rpc RegisterArtifact(RegisterArtifactRequest) returns (RegisterArtifactResponse);

  // Get artifact details
  rpc GetArtifact(GetArtifactRequest) returns (GetArtifactResponse);

  // List artifacts with filters
  rpc ListArtifacts(ListArtifactsRequest) returns (ListArtifactsResponse);

  // Get artifact lineage (DAG)
  rpc GetArtifactLineage(GetArtifactLineageRequest) returns (GetArtifactLineageResponse);

  // Promote artifact to next stage
  rpc PromoteArtifact(PromoteArtifactRequest) returns (PromoteArtifactResponse);

  // Sign artifact
  rpc SignArtifact(SignArtifactRequest) returns (SignArtifactResponse);

  // Delete or archive artifact
  rpc DeleteArtifact(DeleteArtifactRequest) returns (DeleteArtifactResponse);

  // Get download URL for artifact
  rpc GetArtifactDownloadUrl(GetArtifactDownloadUrlRequest) returns (GetArtifactDownloadUrlResponse);
}

// ========================================
// Artifact Definition
// ========================================

message Artifact {
  smidr.common.ArtifactID artifact_id = 1;
  smidr.common.TenantID tenant_id = 2;
  smidr.common.ProjectID project_id = 3;

  string name = 4;
  string artifact_type = 5; // e.g., "binary", "yocto-image", "debian-iso", "log"
  string version = 6;

  // Origin
  smidr.common.JobID job_id = 7;
  smidr.common.AgentID agent_id = 8;
  smidr.common.UserID created_by_user_id = 9;

  // Storage
  string storage_path = 10; // S3 path or similar
  int64 size_bytes = 11;
  string checksum = 12; // SHA256
  string checksum_algorithm = 13;

  // Lineage
  repeated smidr.common.ArtifactID parent_artifact_ids = 14;
  repeated smidr.common.ArtifactID child_artifact_ids = 15;

  // Lifecycle
  ArtifactStage stage = 16;
  google.protobuf.Timestamp retention_until = 17;
  bool is_signed = 18;
  repeated ArtifactSignature signatures = 19;

  // Metadata
  map<string, string> properties = 20;
  smidr.common.Metadata metadata = 21;
  smidr.common.AuditMetadata audit = 22;
}

// ========================================
// Artifact Stage (Promotion Lifecycle)
// ========================================

enum ArtifactStage {
  ARTIFACT_STAGE_UNSPECIFIED = 0;
  ARTIFACT_STAGE_DEVELOPMENT = 1;
  ARTIFACT_STAGE_QA = 2;
  ARTIFACT_STAGE_STAGING = 3;
  ARTIFACT_STAGE_PRODUCTION = 4;
  ARTIFACT_STAGE_ARCHIVED = 5;
}

// ========================================
// Artifact Signature
// ========================================

message ArtifactSignature {
  smidr.common.UserID signer_user_id = 1;
  string signature = 2; // Cryptographic signature
  string algorithm = 3; // e.g., "RSA-SHA256"
  google.protobuf.Timestamp signed_at = 4;
  map<string, string> metadata = 5;
}

// ========================================
// Artifact Lineage (DAG)
// ========================================

message ArtifactLineage {
  smidr.common.ArtifactID artifact_id = 1;
  repeated ArtifactNode nodes = 2;
  repeated ArtifactEdge edges = 3;
}

message ArtifactNode {
  smidr.common.ArtifactID artifact_id = 1;
  string name = 2;
  string artifact_type = 3;
  google.protobuf.Timestamp created_at = 4;
}

message ArtifactEdge {
  smidr.common.ArtifactID source_artifact_id = 1; // Parent
  smidr.common.ArtifactID target_artifact_id = 2; // Child
  string relationship = 3; // e.g., "compiled_from", "built_with"
}

// ========================================
// Request/Response Messages
// ========================================

message RegisterArtifactRequest {
  smidr.common.TenantID tenant_id = 1;
  smidr.common.ProjectID project_id = 2;
  smidr.common.JobID job_id = 3;
  smidr.common.AgentID agent_id = 4;
  string name = 5;
  string artifact_type = 6;
  string version = 7;
  string storage_path = 8;
  int64 size_bytes = 9;
  string checksum = 10;
  repeated smidr.common.ArtifactID parent_artifact_ids = 11;
  map<string, string> properties = 12;
  smidr.common.Metadata metadata = 13;
}

message RegisterArtifactResponse {
  smidr.common.ArtifactID artifact_id = 1;
  bool accepted = 2;
  string message = 3;
}

message GetArtifactRequest {
  smidr.common.ArtifactID artifact_id = 1;
}

message GetArtifactResponse {
  Artifact artifact = 1;
}

message ListArtifactsRequest {
  smidr.common.TenantID tenant_id = 1;
  smidr.common.ProjectID project_id = 2;
  smidr.common.JobID job_id = 3; // Optional filter
  repeated string artifact_types = 4; // Optional filter
  repeated ArtifactStage stages = 5; // Optional filter
  int32 page_size = 6;
  string page_token = 7;
}

message ListArtifactsResponse {
  repeated Artifact artifacts = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message GetArtifactLineageRequest {
  smidr.common.ArtifactID artifact_id = 1;
  int32 max_depth = 2; // How many levels up/down to traverse
}

message GetArtifactLineageResponse {
  ArtifactLineage lineage = 1;
}

message PromoteArtifactRequest {
  smidr.common.ArtifactID artifact_id = 1;
  ArtifactStage target_stage = 2;
  string reason = 3;
}

message PromoteArtifactResponse {
  bool success = 1;
  ArtifactStage current_stage = 2;
  string message = 3;
}

message SignArtifactRequest {
  smidr.common.ArtifactID artifact_id = 1;
  string signature = 2;
  string algorithm = 3;
  map<string, string> metadata = 4;
}

message SignArtifactResponse {
  bool success = 1;
  string message = 2;
}

message DeleteArtifactRequest {
  smidr.common.ArtifactID artifact_id = 1;
  string reason = 2;
  bool force = 3; // Override retention policy
}

message DeleteArtifactResponse {
  bool success = 1;
  string message = 2;
}

message GetArtifactDownloadUrlRequest {
  smidr.common.ArtifactID artifact_id = 1;
  int64 expires_in_seconds = 2; // Presigned URL expiration
}

message GetArtifactDownloadUrlResponse {
  string download_url = 1;
  google.protobuf.Timestamp expires_at = 2;
}
