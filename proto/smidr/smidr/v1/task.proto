syntax = "proto3";

package smidr.v1;

option csharp_namespace = "Smidr.Proto.V1";

import "google/protobuf/timestamp.proto";

import "common.proto";

// Task instruction sent from API to daemon.
message TaskInstruction {
  string task_id = 1;
  TaskType task_type = 2;
  map<string, string> parameters = 3;      // provider-specific inputs
  ResourceRequirements resources = 4;
  int32 priority = 5;                      // higher is more important
  google.protobuf.Timestamp deadline = 6;  // optional
  map<string, string> metadata = 7;        // tags/labels
}

// State transition update sent from daemon to API.
message ReportTaskUpdateRequest {
  string task_id = 1;
  TaskState state = 2;
  string reason = 3;                       // human-readable reason/context
  double progress_percent = 4;             // 0..100, optional
  google.protobuf.Timestamp at = 5;
  map<string, string> metadata = 6;        // e.g., exit codes, provider refs
}

// Acknowledge receipt/acceptance of a task assignment.
message AcknowledgeTaskRequest {
  string task_id = 1;
  bool accepted = 2;
  string message = 3; // optional rejection reason or notes
}

// Streamed response element for ReceiveTasks RPC.
message ReceiveTasksResponse {
  TaskInstruction instruction = 1;
}
