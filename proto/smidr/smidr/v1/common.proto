syntax = "proto3";

package smidr.v1;

option csharp_namespace = "Smidr.Proto.V1";

// Shared enums and types used across API and Daemon

// Task lifecycle states for state transitions.
enum TaskState {
  TASK_STATE_UNSPECIFIED = 0;
  TASK_STATE_QUEUED = 1;
  TASK_STATE_ASSIGNED = 2;
  TASK_STATE_ACCEPTED = 3;
  TASK_STATE_RUNNING = 4;
  TASK_STATE_SUCCEEDED = 5;
  TASK_STATE_FAILED = 6;
  TASK_STATE_CANCELED = 7;
  TASK_STATE_TIMED_OUT = 8;
}

// Task types supported by the system.
enum TaskType {
  TASK_TYPE_UNSPECIFIED = 0;
  TASK_TYPE_CONTAINER_BUILD = 1;
  TASK_TYPE_SCRIPT_EXECUTION = 2;
  TASK_TYPE_IMAGE_PUSH = 3;
  TASK_TYPE_HEALTH_CHECK = 4;
}

// Resource requirements expressed by a task.
message ResourceRequirements {
  int32 cpu_millis = 1;              // requested CPU in millicores
  int64 memory_bytes = 2;            // requested memory
  int64 disk_bytes = 3;              // requested disk
  map<string, string> attributes = 4; // arbitrary constraints/selectors
}

// Resource capabilities reported by a daemon.
message ResourceCapabilities {
  int32 cpu_millis_total = 1;
  int64 memory_bytes_total = 2;
  int64 disk_bytes_total = 3;
  repeated string providers = 4;       // e.g., ["docker", "podman"]
  map<string, string> attributes = 5;  // e.g., arch, os, zones
}
