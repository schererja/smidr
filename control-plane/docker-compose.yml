version: "3.8"

services:
  control-plane:
    build:
      context: .
      dockerfile: src/Smidr.ControlPlane.Api/Dockerfile
    ports:
      - "5000:5000" # HTTP
      - "5001:5001" # HTTPS (GraphQL)
      - "5002:5002" # gRPC (Agents)
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000;https://+:5001;https://+:5002
      - ConnectionStrings__DefaultConnection=Data Source=/data/smidr.db
    volumes:
      - ./data:/data
      - ./certs:/app/certs
    networks:
      - smidr-network

networks:
  smidr-network:
    driver: bridge
